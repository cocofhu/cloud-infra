<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CLS 检索分析 harness(对齐控制台形态的视觉自检)</title>
<style>
  /* 与 verify-regionpop-icons/index.html 同一套宿主 token 模拟:亮/暗由 data-theme 切换。
     注意 --dsw-alias-shadow 故意不定义,复刻宿主主题的真实情况。 */
  :root,[data-theme="light"]{
    --dsw-alias-label-primary:#1f2329;
    --dsw-alias-label-secondary:#3c4250;
    --dsw-alias-label-tertiary:#646a78;
    --dsw-alias-label-caption:#8a8f9b;
    --dsw-alias-bg-layer-1:#ffffff;
    --dsw-alias-bg-layer-2:#f5f6f7;
    --dsw-alias-bg-layer-3:#eceff2;
    --dsw-alias-border-l1:#e4e6ea;
    --dsw-alias-border-l2:#d2d6dc;
    --dsw-alias-brand-primary:#1f2329;
    --dsw-alias-button-primary-fill:#1f2329;
    --dsw-alias-button-info-fill:#0052d9;
    --dsw-alias-label-primary-foreground:#ffffff;
    --dsw-alias-state-success-primary:#18a058;
    --dsw-alias-state-success-tertiary:#e7f6ee;
    --dsw-alias-state-warn-label:#d48806;
    --dsw-alias-state-warn-tertiary:#fdf3e1;
    --dsw-alias-state-error-primary:#d54941;
    --dsw-alias-bg-mask-1:#0000003d;
    --dsw-alias-interactive-bg-hover:rgba(31,35,41,.06);
    background:#f0f1f3;
  }
  [data-theme="dark"]{
    --dsw-alias-label-primary:#e8e9eb;
    --dsw-alias-label-secondary:#c3c6cc;
    --dsw-alias-label-tertiary:#9ba0a9;
    --dsw-alias-label-caption:#747880;
    --dsw-alias-bg-layer-1:#24262b;
    --dsw-alias-bg-layer-2:#33353b;
    --dsw-alias-bg-layer-3:#3e4047;
    --dsw-alias-border-l1:#3d3f46;
    --dsw-alias-border-l2:#494b52;
    --dsw-alias-brand-primary:#e8e9eb;
    --dsw-alias-button-primary-fill:#e8e9eb;
    --dsw-alias-button-info-fill:#5d8bff;
    --dsw-alias-label-primary-foreground:#ffffff;
    --dsw-alias-state-success-primary:#3ccf85;
    --dsw-alias-state-success-tertiary:#1d3a2c;
    --dsw-alias-state-warn-label:#e6a23c;
    --dsw-alias-state-warn-tertiary:#3d3119;
    --dsw-alias-state-error-primary:#e06e67;
    --dsw-alias-bg-mask-1:#00000080;
    --dsw-alias-interactive-bg-hover:rgba(255,255,255,.08);
    background:#1a1b1f;
  }
  body{margin:0;padding:16px;font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}
  .host-card{max-width:980px;margin:0 auto;}
</style>
</head>
<body data-theme="light">
<div class="host-card" id="root"></div>
<script>
  window.__capturedFactory = null;
  window.__ModuleLoader__ = {
    load(def) { if (def && typeof def.factory === "function") window.__capturedFactory = def.factory; },
  };
</script>
<script src="./react.production.min.js"></script>
<script src="./react-dom.production.min.js"></script>
<script src="./client.js"></script>
<script>
  const requireShim = (name) => {
    if (name === "react") return window.React;
    if (name === "react-dom") return window.ReactDOM;
    throw new Error("unknown module " + name);
  };
  const mod = window.__capturedFactory(requireShim);

  // 假后端:只接 /cloud-infra。search 按 context 游标发页,用来驱动「滚到底自动续拉」,
  // 并记录每次请求的 context —— 触底时若锁失效,同一个 context 会被打出好几次。
  const realFetch = window.fetch.bind(window);
  window.__searchCalls = [];
  window.__pageSize = 20;
  window.__totalPages = 3;
  window.fetch = async (url, init) => {
    const href = String(url || "");
    if (!/\/cloud-infra$/.test(href)) return realFetch(url, init);
    const req = JSON.parse((init && init.body) || "{}");
    const json = (body) => new Response(JSON.stringify(body), { status: 200, headers: { "content-type": "application/json" } });
    if (req.method === "meta") return json({ ok: true, skipConfirm: false });
    if (req.method !== "search") return json({ ok: true, items: [], total: 0, hasMore: false, errors: [] });
    window.__searchCalls.push({ context: req.context || "", limit: req.limit });
    // 留一点延迟:否则「加载中」那一行一帧就闪过去,断言抓不到
    if (window.__searchDelay) await new Promise((r) => setTimeout(r, window.__searchDelay));
    const served = req.context ? Number(String(req.context).replace("cur-", "")) || 0 : 0;
    const next = served + 1;
    return json({
      ok: true,
      logs: fakeLogs(window.__pageSize, served * window.__pageSize),
      context: next < window.__totalPages ? `cur-${next}` : "",
      hasMore: next < window.__totalPages,
      queryString: req.queryString || "",
      range: req.range || "1h",
      errors: [],
    });
  };

  const p2 = (n) => String(n).padStart(2, "0");
  function fakeLogs(count, from) {
    // 分布刻意不均匀:确认直方图能看出形状,而不是 12 根等高柱子
    const base = new Date(2026, 7, 31, 14, 5, 0).getTime();
    const start = Number(from) || 0;
    const out = [];
    for (let n = 0; n < count; n += 1) {
      const i = start + n;
      const jitter = Math.round(Math.sin(i * 1.7) * 90) * 1000;
      const timeMs = base + i * 92 * 1000 + jitter + (i % 4) * 400;
      const d = new Date(timeMs);
      const fields = {
        ssql_process_duration: String(120 + ((i * 37) % 900)),
        ssql_query_window_start_time: `2026-08-31 ${p2(d.getHours())}:${p2(d.getMinutes())}:00.000`,
        ssql_err_detail_msg: i % 5 === 0 ? "connection reset by peer" : "",
        cls_module: "ssql",
        ssql_failed_line: String(i % 3),
        ssql_success_line: String((i * 11) % 40),
        ssql_process_start_time: `2026-08-31 ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}.016`,
        ssql_err_type: i % 5 === 0 ? "UpstreamError" : "",
      };
      // 偶数条:content 就是 fields 的 JSON 原文(展开后不该再贴一遍);
      // 奇数条:content 是 nginx 那种纯文本原文(展开后必须能看到)
      const rawText = `10.0.0.${10 + (i % 6)} - - [31/Aug/2026:${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())} +0800] "GET /api/v1/query?id=${i} HTTP/1.1" ${i % 5 === 0 ? 500 : 200} 1274 "-" "curl/8.4.0"`;
      out.push({
        timeMs,
        timeLabel: `2026-08-31 ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3, "0")}`,
        content: i % 2 === 0 ? JSON.stringify(fields) : rawText,
        source: "10.0.0." + (10 + (i % 6)),
        fileName: "/data/log/ssql/app.log",
        fields,
      });
    }
    return out;
  }

  window.__mount = function (theme, opts) {
    document.body.setAttribute("data-theme", theme);
    const o = opts || {};
    const payload = {
      kind: "cls",
      resourceKind: "cls",
      view: "search",
      region: "ap-guangzhou",
      regions: [{ id: "ap-guangzhou", name: "广州", group: "大陆" }],
      items: [{
        id: "tencent.cls:ap-guangzhou:11111111-2222-3333-4444-555555555555",
        moduleId: "tencent.cls",
        provider: "tencent",
        kind: "cls",
        title: "cls_service_log",
        openLabel: "检索分析",
        columns: [
          { label: "主题ID", value: "11111111-2222-3333-4444-555555555555" },
          { label: "日志集", value: "cls_service_logging" },
        ],
      }],
      queryString: o.cql != null ? o.cql : "status:500 OR level:ERROR",
      range: "1h",
      logs: o.empty ? [] : fakeLogs(o.count || 26),
      // 首屏已经算第 1 页,续拉从游标 cur-1 接着取
      context: o.context != null ? o.context : "cur-1",
      hasMore: o.hasMore != null ? o.hasMore : true,
      total: 1,
      errors: [],
    };
    window.__searchCalls = [];
    const props = {
      block: {
        kind: "tool.call.result",
        call: { argsRaw: JSON.stringify({ kind: "cls", query: "", region: "ap-guangzhou" }) },
        result: payload,
      },
    };
    const rootEl = document.getElementById("root");
    // 每次挂载都换一个 root:同一份 payload 的 toolSig 不变,复用 root 会把上一轮
    // 追加进去的日志和展开/换行状态带过来,续拉的断言就全乱了
    if (window.__reactRoot) window.__reactRoot.unmount();
    window.__reactRoot = window.ReactDOM.createRoot(rootEl);
    window.__reactRoot.render(window.React.createElement(mod.SearchToolView, props));
    return true;
  };

  // 触底续拉:量行数与请求次数。scrollTop 直接写到底,再派一次 scroll(React 的 onScroll 监听真实事件)
  window.__readLogFeed = function () {
    const table = document.querySelector(".ci-logtable");
    const more = document.querySelector(".ci-log-more");
    return {
      rows: document.querySelectorAll(".ci-logrow").length,
      sentinel: more ? more.textContent : "",
      hasSentinel: !!more,
      loadMoreBtn: [...document.querySelectorAll("button")].some((b) => /继续拉取|拉取中/.test(b.textContent)),
      footbar: !!document.querySelector(".ci-footbar"),
      scrollable: table ? table.scrollHeight > table.clientHeight + 1 : null,
      atBottom: table ? table.scrollHeight - table.scrollTop - table.clientHeight : null,
      calls: window.__searchCalls.length,
      contexts: window.__searchCalls.map((c) => c.context),
      note: (document.querySelector(".ci-foot-note span") || {}).textContent || "",
    };
  };

  window.__scrollLogsToBottom = function (times) {
    const table = document.querySelector(".ci-logtable");
    if (!table) return false;
    for (let i = 0; i < (times || 1); i += 1) {
      table.scrollTop = table.scrollHeight;
      table.dispatchEvent(new Event("scroll", { bubbles: true }));
    }
    return true;
  };
</script>
</body>
</html>
